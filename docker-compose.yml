services:
  trt-technikjeopardy:
    build: .
    container_name: trt-technikjeopardy
    volumes:
      - trt_jeopardy_db:/app/data
    ports:
      - "5050:5000"
    environment:
      - FLASK_DEBUG=0
      - PORT=5000
      - DB_PATH=/app/data/jeopardy.db
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD muss gesetzt werden}
    restart: unless-stopped

volumes:
  trt_jeopardy_db:
