{% extends "base.html" %}
{% block title %}Frage bearbeiten &ndash; Technik-Jeopardy{% endblock %}
{% block subtitle %}Admin{% endblock %}
{% block actions %}
  <a class="nav-link active" href="{{ url_for('admin') }}">Fragen</a>
  <a class="nav-link" href="{{ url_for('admin_settings') }}">Einstellungen</a>
  <a class="nav-link" href="{{ url_for('play') }}">Spiel</a>
{% endblock %}
{% block content %}
  <main class="main">
    <h1 class="page-title">Frage bearbeiten</h1>
    <form method="post" class="form card">
      <label>Kategorie
        <select name="category_id" required>
          {% for c in categories %}
          <option value="{{ c.id }}" {% if c.id == question['category_id'] %}selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </label>
      <div class="row">
        <label>Punkte
          <input type="number" inputmode="numeric" name="points" min="1" value="{{ question['points'] }}" required>
        </label>
        <label>Klassenstufe
          <input type="text" name="grade_level" value="{{ question['grade_level'] or '' }}">
        </label>
      </div>
      <label>Fragetext
        <textarea name="question_text" required>{{ question['question_text'] }}</textarea>
      </label>
      <label>Antworttext
        <textarea name="answer_text" required>{{ question['answer_text'] }}</textarea>
      </label>
      <label>Kompetenzbereich
        <input type="text" name="competence_area" value="{{ question['competence_area'] or '' }}">
      </label>
      <label>Hinweis <span class="hint">(optional)</span>
        <textarea name="hint">{{ question['hint'] or '' }}</textarea>
      </label>
      <div class="form-actions">
        <button class="btn-primary" type="submit">Speichern</button>
        <a class="btn-ghost" href="{{ url_for('admin') }}">Abbrechen</a>
      </div>
    </form>
  </main>
{% endblock %}
