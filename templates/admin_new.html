{% extends "base.html" %}
{% block title %}Neue Frage &ndash; Technik-Jeopardy{% endblock %}
{% block subtitle %}Admin{% endblock %}
{% block actions %}
  <a class="nav-link active" href="{{ url_for('admin') }}">Fragen</a>
  <a class="nav-link" href="{{ url_for('admin_settings') }}">Einstellungen</a>
  <a class="nav-link" href="{{ url_for('play') }}">Spiel</a>
{% endblock %}
{% block content %}
  <main class="main">
    <h1 class="page-title">Neue Frage</h1>
    <form method="post" class="form card">
      <label>Kategorie
        <select name="category_id" required>
          {% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
        </select>
      </label>
      <div class="row">
        <label>Punkte
          <input type="number" inputmode="numeric" name="points" min="1" value="100" required>
        </label>
        <label>Klassenstufe
          <input type="text" name="grade_level" placeholder="z. B. 7 oder 7-8">
        </label>
      </div>
      <label>Fragetext
        <textarea name="question_text" required></textarea>
      </label>
      <label>Antworttext
        <textarea name="answer_text" required></textarea>
      </label>
      <label>Kompetenzbereich
        <input type="text" name="competence_area">
      </label>
      <label>Hinweis <span class="hint">(optional)</span>
        <textarea name="hint"></textarea>
      </label>
      <div class="form-actions">
        <button class="btn-primary" type="submit">Speichern</button>
        <a class="btn-ghost" href="{{ url_for('admin') }}">Abbrechen</a>
      </div>
    </form>
  </main>
{% endblock %}
